import static app.cash.redwood.buildsupport.TargetGroup.ToolkitComposeUi

redwoodBuild {
  targets(ToolkitComposeUi)
  publishing()
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

kotlin {
  sourceSets {
    commonMain {
      kotlin.srcDir(redwoodBuild.generateComposeHelpers(tasks, 'app.cash.redwood.widget.compose'))
      dependencies {
        api projects.redwoodWidget
        api libs.jetbrains.compose.ui
      }
    }
    commonTest {
      dependencies {
        implementation libs.kotlinx.coroutines.core
        implementation projects.redwoodWidgetTesting
      }
    }
  }
}

android {
  namespace = 'app.cash.redwood.widget.composeui'

  testOptions {
    unitTests.returnDefaultValues = true
  }
}
